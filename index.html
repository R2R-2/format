<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>File Browser</title>
</head>

<body>

    <h1>Files</h1>
    <ul id="file-list"></ul>

    <script>
        const params = new URLSearchParams(window.location.search);
        const dir = params.get("dir");

        const repoOwner = "R2R-2";
        const repoName = "format";

        if (dir) {
            const apiURL = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${dir}`;

            fetch(apiURL)
                .then(res => res.json())
                .then(files => {
                    const list = document.getElementById("file-list");

                    // to include custom html define a file called header.html in the target directory containing the markup/text you want.
                    const headerFile = files.find(f => f.name === "header.html");
                    if (headerFile) {
                        // Fetch the actual content of the header file
                        fetch(headerFile.download_url)
                            .then(res => res.text())
                            .then(htmlContent => {
                                const headerDiv = document.createElement("div");
                                headerDiv.innerHTML = htmlContent;
                                // Insert it before the list
                                list.parentNode.insertBefore(headerDiv, list);
                            });
                    }

                    files.forEach(file => {
                        if (file.type === "file") {

                            const li = document.createElement("li");
                            const a = document.createElement("a");

                            a.href = file.download_url;
                            a.textContent = file.name;

                            li.appendChild(a);
                            list.appendChild(li);
                        }
                    });
                })
                .catch(err => {
                    document.body.innerHTML += "<p>Error loading directory.</p>";
                    console.error(err);
                });
        }
    </script>

</body>

</html>
