<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Browser</title>
    <style>
        :root {
            --bg: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #666666;
            --accent: #0066cc;
            --border: #eeeeee;
            --hover-bg: #f8f9fa;
            --success: #2da44e; /* GitHub-style green */
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        h2 {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-top: 0;
            margin-bottom: 16px;
        }

        #file-list {
            list-style: none;
            padding: 0;
            margin: 24px 0 0 0;
            border-top: 1px solid var(--border);
        }

        #file-list li {
            border-bottom: 1px solid var(--border);
        }

        #file-list a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            text-decoration: none;
            color: var(--text-main);
            transition: background 0.2s ease;
        }

        #file-list a:hover {
            background-color: var(--hover-bg);
            color: var(--accent);
        }

        /* The Name Container (for Name + Primary Badge) */
        .file-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Primary Badge Styling */
        .primary-badge {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--success);
            border: 1px solid var(--success);
            padding: 2px 6px;
            border-radius: 12px;
            line-height: 1;
        }

        .icon-indicator {
            font-size: 0.9rem;
            opacity: 0.5;
        }

        .custom-header-wrapper {
            margin-bottom: 32px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="page-title">Loading...</h1>
        <div id="custom-header-area" class="custom-header-wrapper"></div>
        <ul id="file-list"></ul>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const dir = params.get("dir");
        const primaryFile = params.get("primary"); // Get the primary filename

        const repoOwner = "R2R-2";
        const repoName = "format";

        const displayDir = dir ? dir : "Root";
        const fullTitle = `${displayDir} Format Description Documentation`;
        document.title = fullTitle;
        document.getElementById("page-title").textContent = fullTitle;

        if (dir) {
            const apiURL = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${dir}`;

            fetch(apiURL)
                .then(res => {
                    if (!res.ok) throw new Error("Directory not found.");
                    return res.json();
                })
                .then(files => {
                    const list = document.getElementById("file-list");
                    const headerArea = document.getElementById("custom-header-area");

                    const headerFile = files.find(f => f.name === "header.html");
                    if (headerFile) {
                        fetch(headerFile.download_url)
                            .then(res => res.text())
                            .then(html => headerArea.innerHTML = html);
                    }

                    files.forEach(file => {
                        if (file.type === "file" && file.name !== "header.html") {
                            const li = document.createElement("li");
                            const a = document.createElement("a");
                            
                            const isTxt = file.name.toLowerCase().endsWith('.txt');
                            const isPrimary = (file.name === primaryFile);

                            // Left side: Name + Badge
                            const infoDiv = document.createElement("div");
                            infoDiv.className = "file-info";
                            
                            const nameSpan = document.createElement("span");
                            nameSpan.textContent = file.name;
                            infoDiv.appendChild(nameSpan);

                            if (isPrimary) {
                                const badge = document.createElement("span");
                                badge.className = "primary-badge";
                                badge.textContent = "primary";
                                infoDiv.appendChild(badge);
                            }

                            // Right side: Icon
                            const iconSpan = document.createElement("span");
                            iconSpan.className = "icon-indicator";
                            iconSpan.textContent = isTxt ? "↗" : "↓";

                            a.href = file.download_url;
                            if (!isTxt) a.setAttribute("download", file.name);

                            a.appendChild(infoDiv);
                            a.appendChild(iconSpan);
                            li.appendChild(a);
                            list.appendChild(li);
                        }
                    });
                })
                .catch(err => {
                    document.getElementById("file-list").innerHTML = `<p>${err.message}</p>`;
                });
        }
    </script>
</body>
</html>
