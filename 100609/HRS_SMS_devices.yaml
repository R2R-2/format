################################################################################
# Device definitions for the Hugh Sharp
#
# See README.md in this directory

includes:
  - /opt/openrvdas/local/sharp/Trimble.yaml
  - /opt/openrvdas/local/devices/misc_device_types.yaml
devices:
######################################
  pos: 
    category: "device"
    device_type: "POS"
    serial_number: ""
    description: "Applanix POS MV is a compact, fully integrated position and orientation system (GNSS + INS)"
    
    fields: 
      GPSTime: "POS_GPSTime"
      GPSDate: "POS_GPSDate"
      Latitude: "POS_Latitude"
      NorS: "POS_NorS"
      Longitude: "POS_Longitude"
      EorW: "POS_EorW"
      FixQuality: "POS_FixQuality"
      NumSats: "POS_NumSats"
      HDOP: "POS_HDOP"
      AntennaHeight: "POS_AntennaHeight"
      GeoidHeight: "POS_GeoidHeight"
      LastDGPSUpdate: "POS_LastDGPSUpdate"
      DGPSStationID: "POS_DGPSStationID"
      Status: "POS_Status"
      Mode: "POS_Mode"
      SpeedKt: "POS_SpeedKt"
      SpeedKm: "POS_SpeedKm"
      CourseTrue: "POS_CourseTrue"
      Day: "POS_Day"
      Month: "POS_Month"
      Year: "POS_Year"
      LocalHours: "POS_LocalHours"
      LocalMinutes: "POS_LocalMinutes" 
    # Heading fields
      HeadingTrue: "POS_HeadingTrue"
      HeadingType: "POS_HeadingType"
      Deviation: "POS_Deviation"
      DeviationDir: "POS_DeviationDir"
      Variation: "POS_Variation"
      VariationDir: "POS_VariationDir"
      RateOfTurn: "POS_RateOfTurn"
    # Motion fields
      Roll: "POS_Roll"
      Pitch: "POS_Pitch"
      Heave: "POS_Heave"
      RollRate: "POS_RollRate"
      PitchRate: "POS_PitchRate"
      YawRate: "POS_YawRate"
      VerticalVel: "POS_VerticalVel"
    # Quality fields
      HorizQual: "POS_HorizQual"
      HeightQual: "POS_HeightQual"
      HeadingQual: "POS_HeadingQual"
      RollPitchQual: "POS_RollPitchQual" 
      EventType: "POS_EventType"
      GyroCal: "POS_GyroCal" 
      GyroOffset: "POS_GyroOffset"
    # PASHR fields
      RollAcc: "POS_RollAcc"
      PitchAcc: "POS_PitchAcc"
      HeadingAcc: "POS_HeadingAcc" 
      AidingStatus: "POS_AidingStatus" 
      IMUStatus: "POS_IMUStatus" 
      
######################################
  flnturt:
    category: "device"
    device_type: "FLNTURT"
    serial_number: ""
    description: "Seabird Scientific dual channel fluorometer (fluorescence/turbidity)"
  
    fields:
      Date: "FLNTURT_DATE"
      Time: "FLNTURT_Time" 
      ChlChannel: "FLNTURT_ChlChannel"
      ChlCount: "FLNTURT_ChlCount"
      TurbChannel: "FLNTURT_TurbChannel"
      TurbCount: "FLNTURT_TurbCount"
      Auxiliary: "FLNTURT_Auxiliary"
    
######################################
  rmyoung:
    category: "device"
    device_type: "RMYoung"
    serial_number: "WM12722 (port anemometer), WM12723 (stbd anemometer), TSO3243 (Humitter/Temp), BP02035 (Barometer)"
    description: "Serial translator for anemometers/barometers/humitters"
  
    fields:
      PortRelWindDir: "RMYoung_PortRelWindDir"
      #WindAngle: "RMYoung_WindAngle"
      #WindSpeed: "RMYoung_WindSpeed"
      PortRelWindSpeed: "RMYoung_PortRelWindSpeed"
      StbdRelWindDir: "RMYoung_StbdRelWindDir"
      StbdRelWindSpeed: "RMYoung_StbdRelWindSpeed"
      WindSpeedUnits: "RMYoung_WindSpeedUnits"
      WindDirTrue: "RMYoung_WindDirTrue" 
      WindDirMag: "RMYoung_WindDirMag"
      WindSpeedKt: "RMYoung_WindSpeedKt" 
      WindSpeedMs: "RMYoung_WindSpeedMs"
      WindSpeedKm: "RMYoung_WindSpeedKm"  
      WindSide: "RMYoung_WindSide"
      BaroInches: "RMYoung_BaroInches"  
      BaroBars: "RMYoung_BaroBars"   
      AirTemp: "RMYoung_AirTemp"
      WaterTemp: "RMYoung_WaterTemp"  
      Temp: "RMYoung_Temp"
      RelHumidity: "RMYoung_RelHumidity"
      AbsHumidity: "RMYoung_AbsHumidity"
      DewPoint: "RMYoung_DewPoint" 
      Value1: "RMYoung_TempC"
      Value2: "RMYoung_RelHumidity"
      Value3: "RMYoung_BaroPressure(hPa)"

######################################
  sbe4501:
    category: "device"
    device_type: "TSG_SBE45"
    serial_number: "0091"
    description: "Thermosalinograph Sea-Bird SBE-45"
    
